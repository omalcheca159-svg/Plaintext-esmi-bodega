<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08164d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ESMI · Control de Herramientas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Colores corporativos ESMI: azul marino + celeste (amarillo del casco como acento) */
  --bg:#050c26;--bg2:#08133a;--panel:#0b1a4a;--panel2:#10235e;--line:#1a3070;--line2:#294494;
  --text:#eaf3ff;--muted:#9db3dd;--dim:#6379ad;
  --navy:#1a2a9c;--brand:#38c6f4;--brand2:#9be3fb;--blue:#4f8dff;--green:#22c993;--red:#ff5d6c;--amber:#f5c330;--violet:#a98bff;
  --r:14px;--r2:10px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 100% -10%,rgba(56,198,244,.12),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(26,42,156,.35),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.02em}
.hidden{display:none!important}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);
  padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;min-height:40px}
.btn:hover{border-color:#3d5bb5;background:#16307a}
.btn:active{transform:translateY(1px)}
a.btn{text-decoration:none;color:inherit}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:linear-gradient(180deg,#5fd6fa,#1fa9e3);border-color:#7fdffb;color:#031335}
.btn.primary:hover{filter:brightness(1.07)}
.btn.blue{background:linear-gradient(180deg,#3346d4,#1a2a9c);border-color:#4a5ee6;color:#fff}
.btn.green{background:linear-gradient(180deg,#27d398,#14a874);border-color:#3ae0a6;color:#03271a}
.btn.red{background:rgba(255,93,93,.12);border-color:rgba(255,93,93,.45);color:#ffb3b3}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 20px;min-height:52px;font-size:17px}
.btn.icon{padding:0;width:40px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(56,198,244,.2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:70px;resize:vertical}

/* ---------- tarjetas ---------- */
.card{background:linear-gradient(180deg,var(--panel),#09163f);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0;font:700 18px "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.card .sub{font-size:13px;color:var(--muted)}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(56,198,244,.14);color:var(--brand);font:800 15px "Barlow Condensed","Arial Narrow",Arial,sans-serif;border:1px solid rgba(56,198,244,.35)}
.step.done{background:rgba(31,201,141,.15);color:var(--green);border-color:rgba(31,201,141,.4)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.p-green{background:rgba(31,201,141,.12);color:#5ee3b2;border-color:rgba(31,201,141,.3)}
.p-blue{background:rgba(47,155,255,.12);color:#7cc0ff;border-color:rgba(47,155,255,.3)}
.p-amber{background:rgba(255,197,61,.12);color:#ffd677;border-color:rgba(255,197,61,.3)}
.p-red{background:rgba(255,93,93,.12);color:#ff9d9d;border-color:rgba(255,93,93,.3)}
.p-gray{background:rgba(142,163,187,.1);color:var(--muted);border-color:rgba(142,163,187,.25)}
.p-violet{background:rgba(169,139,255,.12);color:#c6b4ff;border-color:rgba(169,139,255,.3)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(6,14,44,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{width:52px;height:52px;display:grid;place-items:center;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(56,198,244,.35))}
.logo.box{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3346d4,#38c6f4);color:#fff}
.brand-t{font:800 20px/1.05 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.brand-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px;font-size:12px;color:var(--brand2);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.brand-a{font-size:12px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;font-size:12px;color:var(--muted);background:var(--bg2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(31,201,141,.6);animation:pulse 2s infinite}
.dot.off{background:var(--red);animation:none}.dot.busy{background:var(--amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,201,141,.55)}70%{box-shadow:0 0 0 8px rgba(31,201,141,0)}100%{box-shadow:0 0 0 0 rgba(31,201,141,0)}}
.clock{font:700 15px "JetBrains Mono",ui-monospace,monospace}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;background:var(--bg2)}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#3346d4,#38c6f4);font:800 14px "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff;flex:none}
@media(max-width:1100px){.brand-a,.hide-md{display:none!important}}
@media(max-width:700px){.toasts{bottom:calc(96px + var(--safe-b));left:12px;right:12px;max-width:none}.brand-s{display:none}.brand-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw;font-size:16px!important}.top-in{padding:8px 12px;gap:10px}.logo{width:40px;height:40px}.brand-t{font-size:17px}.hide-sm{display:none!important}}

/* ---------- layout ---------- */
.main{max-width:1440px;margin:0 auto;padding:16px 18px 110px}
@media(max-width:700px){.main{padding:12px 12px calc(96px + var(--safe-b))}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--panel),#09163f);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--line2);transform:translateY(-1px)}
.kpi .k-l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .k-v{font:800 32px/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin-top:4px}
.kpi .k-s{font-size:12px;color:var(--dim)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--blue))}
.kpi svg{position:absolute;right:12px;top:12px;width:20px;height:20px;color:var(--c,var(--blue));opacity:.9}

.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.on{background:linear-gradient(180deg,#2d42cc,#1a2a9c);color:#fff;box-shadow:0 6px 16px rgba(26,42,156,.5),inset 0 -2px 0 var(--brand)}
.tab .badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
@media(max-width:700px){.tabs{display:none}}

/* barra inferior móvil */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,19,58,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none;padding:6px 6px calc(6px + var(--safe-b))}
.bnav-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
.bn svg{width:22px;height:22px}.bn.on{color:var(--brand)}
.bn.scan{position:relative;top:-14px}
.bn.scan .fab{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#5fd6fa,#1fa9e3);display:grid;place-items:center;color:#031335;box-shadow:0 10px 24px rgba(56,198,244,.45)}
.bn.scan .fab svg{width:28px;height:28px}
@media(max-width:700px){.bnav{display:block}}

/* ---------- tablas ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:#0a1950;text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(41,68,148,.35);vertical-align:middle}
.tbl tr:hover td{background:rgba(47,155,255,.04)}
.tbl tr.click{cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--dim)}

/* ---------- listas / items ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--muted)}
.code{font:700 12.5px "JetBrains Mono",ui-monospace,monospace;color:var(--brand2);background:rgba(56,198,244,.08);border:1px solid rgba(56,198,244,.22);padding:1px 7px;border-radius:6px;white-space:nowrap}
.qrbox{background:#fff;border-radius:10px;padding:6px;display:inline-grid;place-items:center;flex:none}
.qrbox svg{display:block}

/* buscador con desplegable */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#0a1950;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:20}
.ac-opt{padding:9px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid rgba(41,68,148,.35)}
.ac-opt:hover,.ac-opt.on{background:rgba(47,155,255,.1)}

/* trabajador seleccionado */
.worker{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(56,198,244,.12),rgba(26,42,156,.25));border:1px solid rgba(56,198,244,.35)}
.worker .avatar{width:52px;height:52px;font-size:20px;border-radius:12px}
.worker .nm{font:700 19px/1.15 "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font:800 24px "Barlow Condensed","Arial Narrow",Arial,sans-serif}

/* cantidad */
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:32px;background:var(--panel2);border:0;cursor:pointer;font-weight:800}
.qty input{width:44px;text-align:center;border:0;background:var(--bg2);height:32px;outline:none}

.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button svg{width:18px;height:18px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button.on.out{background:rgba(56,198,244,.15);color:var(--brand2);box-shadow:inset 0 0 0 1px rgba(56,198,244,.4)}
.seg button.on.in{background:rgba(31,201,141,.13);color:#5ee3b2;box-shadow:inset 0 0 0 1px rgba(31,201,141,.4)}

/* ---------- modal / drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(3,7,12,.7);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);animation:up .18s}
.modal.wide{width:min(980px,100%)}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.m-h h3{margin:0;font:800 19px "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;flex:1}
.m-b{padding:16px}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
@media(max-width:700px){.ov{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:var(--safe-b)}}

/* escáner */
.scanner{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:280px}
#qr-reader{width:100%}
#qr-reader video{width:100%!important;height:auto!important;display:block;object-fit:cover}
.scan-frame{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.scan-frame i{width:62%;aspect-ratio:1;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);border:2px solid rgba(56,198,244,.9)}
.scan-line{position:absolute;left:19%;right:19%;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);top:30%;animation:sl 2s infinite ease-in-out}
@keyframes sl{50%{top:68%}}
.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(31,201,141,.9) inset}100%{box-shadow:0 0 0 40px rgba(31,201,141,0) inset}}

/* toasts */
.toasts{position:fixed;bottom:20px;right:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
body:has(.ov) .toasts{top:12px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);z-index:90}
.toast{background:#0d1d55;border:1px solid var(--line2);border-left:4px solid var(--blue);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:up .2s}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);
  background:linear-gradient(160deg,#13238a,#071242 55%,#050c26),var(--bg)}
.login-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(56,198,244,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,198,244,.08) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.login-art>*{position:relative}
.hazard{height:10px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,#0a0a2a 14px 28px);opacity:.9;width:220px}
.big{font:800 64px/0.95 "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.big span{color:var(--brand)}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-box{width:min(420px,100%)}
@media(max-width:900px){.login{grid-template-columns:1fr}.login-art{padding:28px 22px;border-right:0;border-bottom:1px solid var(--line)}.big{font-size:42px}.login-art .feat{display:none}}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px}
.feat div{display:flex;gap:10px;align-items:center;font-weight:600;color:#d6e6ff;background:rgba(8,20,70,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.feat svg{width:20px;height:20px;color:var(--brand)}

/* portal trabajador */
.portal{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.fotocheck{background:linear-gradient(135deg,#1a2a9c,#0a1950);border:1px solid var(--line2);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.fotocheck::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(rgba(56,198,244,.25),transparent 70%)}

.demo-banner{background:repeating-linear-gradient(-45deg,rgba(255,197,61,.12) 0 12px,rgba(255,197,61,.05) 12px 24px);border:1px dashed rgba(255,197,61,.5);color:#ffd677;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
.skel{background:linear-gradient(90deg,#0d1c52,#16307a,#0d1c52);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.drawer-qr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--bg2);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--blue);color:#cfe6ff;background:rgba(47,155,255,.12)}
.ret-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
@media(max-width:700px){.ret-row{grid-template-columns:auto 1fr}.ret-row>.ret-ctrl{grid-column:1/-1}}
.label-prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
